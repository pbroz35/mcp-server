[project]
name = "research-agent-backend"
version = "0.1.0"
description = "LangChain deep agent that reaches its tools over MCP, streaming AG-UI events."
requires-python = ">=3.12"
dependencies = [
    # Upper bounds at the majors this code was verified against.
    "deepagents>=0.7.13,<0.8",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langchain-anthropic>=1.7.2,<2",
    "langgraph>=1.2.11,<2",
    "ag-ui-protocol>=0.1.22,<0.2",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.38",
    "pydantic-settings>=2.15,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-asyncio>=1.4", "httpx>=0.28", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
