[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server for a research agent: web search and semantic document retrieval."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.30",
    # Retrieval stack. Upper bounds are the majors this code was verified
    # against — an unbounded pin let openai resolve two majors forward.
    "asyncpg>=0.31,<0.32",
    "openai>=3.13,<4",     # embeddings only — this server never calls an LLM
    "pypdf>=6.18,<7",
    "tiktoken>=0.14,<0.15",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
mcp-server = "mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
